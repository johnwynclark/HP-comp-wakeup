<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios Phoenix — Waking Up</title>
<meta name="theme-color" content="#171717">
<style>
:root{--red:#c8102e;--gold:#f2b800;--ink:#f7f4ed;--muted:#b9b4aa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#3a2024 0,#1b1719 45%,#101012 100%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.panel{width:min(100%,560px);text-align:center;padding:42px 30px;border:1px solid #ffffff20;border-radius:20px;background:#171719d9;box-shadow:0 24px 80px #0008}
.emblem{width:86px;height:86px;margin:0 auto 20px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:36px;font-weight:800;letter-spacing:-4px;text-shadow:0 0 18px #f2b80066}
.kicker{font-size:12px;letter-spacing:.28em;color:var(--gold);font-weight:700}
h1{font-size:clamp(27px,6vw,38px);letter-spacing:.12em;margin:9px 0 8px}
p{color:var(--muted);line-height:1.6;margin:0 auto;max-width:420px}
.status{margin:30px auto 14px;font-weight:650;color:#fff}
.spinner{width:42px;height:42px;margin:0 auto 16px;border:3px solid #ffffff24;border-top-color:var(--gold);border-right-color:var(--red);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.track{height:5px;max-width:330px;margin:20px auto 12px;background:#ffffff18;border-radius:9px;overflow:hidden}
.track span{display:block;width:35%;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--red),var(--gold));animation:travel 1.6s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
.small{font-size:12px;color:#89847d;margin-top:20px}
button{margin-top:22px;border:1px solid #ffffff45;border-radius:8px;padding:10px 18px;background:#ffffff0d;color:#fff;font:inherit;cursor:pointer}
button:hover{background:#ffffff18}
.hidden{display:none}
</style>
</head>
<body>
<main class="panel">
  <div class="emblem" aria-hidden="true">HP</div>
  <div class="kicker">GUILD COMPOSITION COMMAND CENTER</div>
  <h1>HELIOS PHOENIX</h1>
  <p>Your command center is preparing to return. Please wait while we reconnect to the server.</p>
  <div class="status" id="status" role="status" aria-live="polite">Helios Phoenix is waking up…</div>
  <div class="spinner" id="spinner" aria-hidden="true"></div>
  <div class="track" id="track" aria-hidden="true"><span></span></div>
  <p id="detail">The first connection may take a little longer if the server has been idle.</p>
  <button id="retry" class="hidden" type="button">Try connecting again</button>
  <div class="small">Thank you for your patience, guild member.</div>
</main>
<script>
// IMPORTANT: Replace this with your Render service URL (no trailing slash).
const APP_URL = "https://YOUR-RENDER-SERVICE.onrender.com";

const statusEl = document.getElementById("status");
const detailEl = document.getElementById("detail");
const spinner = document.getElementById("spinner");
const track = document.getElementById("track");
const retry = document.getElementById("retry");

let running = false;
let attempts = 0;
let startedAt = 0;

function showRetry(message) {
  statusEl.textContent = "Still trying to connect…";
  detailEl.textContent = message;
  spinner.classList.add("hidden");
  track.classList.add("hidden");
  retry.classList.remove("hidden");
}

async function connect() {
  if (running) return;
  running = true;
  attempts = 0;
  startedAt = Date.now();
  retry.classList.add("hidden");
  spinner.classList.remove("hidden");
  track.classList.remove("hidden");
  statusEl.textContent = "Helios Phoenix is waking up…";
  detailEl.textContent = "The first connection may take a little longer if the server has been idle.";

  if (APP_URL.includes("YOUR-RENDER-SERVICE")) {
    showRetry("Set APP_URL in this file to your actual Render service URL before publishing this page.");
    running = false;
    return;
  }

  while (Date.now() - startedAt < 120000) {
    attempts++;
    statusEl.textContent = attempts === 1
      ? "Helios Phoenix is waking up…"
      : "Reconnecting to Helios Phoenix…";
    detailEl.textContent = attempts === 1
      ? "Starting the connection to the guild server."
      : "Connection attempt " + attempts + ". Please keep this page open.";

    try {
      // no-cors allows this simple cross-origin wake-up request without changing
      // the existing app's CORS configuration. We redirect when the request returns.
      await fetch(APP_URL + "/?wake=" + Date.now(), {
        method: "GET",
        mode: "no-cors",
        cache: "no-store",
        redirect: "follow"
      });
      statusEl.textContent = "Connection received — opening the command center…";
      detailEl.textContent = "You will be redirected in a moment.";
      window.location.replace(APP_URL);
      return;
    } catch (err) {
      await new Promise(resolve => setTimeout(resolve, 5000));
    }
  }

  showRetry("The server has not responded yet. You can try again, or open the command center directly.");
  running = false;
}

retry.addEventListener("click", connect);
connect();
</script>
</body>
</html>
